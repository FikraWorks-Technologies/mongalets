name: Bootstrap MongaLets source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct complete frontend source
        shell: bash
        run: |
          cat .bootstrap/chunk_*.b64 | base64 --decode > /tmp/mongalets-source.zip
          rm -rf /tmp/mongalets-source
          mkdir -p /tmp/mongalets-source
          unzip -q /tmp/mongalets-source.zip -d /tmp/mongalets-source
          source_dir="$(find /tmp/mongalets-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          rsync -a --exclude='.git' --exclude='README.md' "$source_dir"/ ./

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit public experience
        run: |
          git add src/pages/HomePage.tsx src/styles.css
          git commit -m "feat(marketing): build responsive MongaLets public experience" \
            -m "Add the one-page product website, role discovery, provider categories, dashboard previews, FikraWorks BulkSMS presentation, responsive property showcases, accessible modals and mobile-first interaction states."

      - name: Commit authentication and routing
        run: |
          git add src/lib src/pages/LoginPage.tsx
          git commit -m "feat(auth): add role-aware login and synchronized sessions" \
            -m "Add protected role routing, owner, tenant, provider, guest and administrator login flows, demo credentials, password recovery, one-time-password demonstrations and cross-tab session synchronization."

      - name: Commit role dashboards
        run: |
          git add src/App.tsx src/pages/PortalPage.tsx src/pages/DashboardPages.tsx
          git commit -m "feat(dashboards): complete all role-based application workspaces" \
            -m "Add owner, tenant, service-provider, guest and platform-administrator portals with portfolio, requests, jobs, quotations, calendars, finances, messaging, reports, settings and responsive operational views."

      - name: Commit project documentation
        run: |
          git add DASHBOARD_COMPLETION.md FRONTEND_ROADMAP.md
          git commit -m "docs(project): document completed modules and delivery roadmap" \
            -m "Record implemented dashboard coverage, user-experience details, integration boundaries, production priorities and the next backend, payments, communications and listings milestones."

      - name: Remove temporary bootstrap assets
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git add -A
          git commit -m "chore(repo): remove temporary source bootstrap assets" \
            -m "Remove the encoded archive chunks and one-time import workflow after reconstructing and committing the complete frontend source tree."

      - name: Push detailed commit history
        run: git push origin main
